<!DOCTYPE html><!--indica que el docuemto es HTML5-->
<html lang="en"><!--Especifica que el idioma principal del documento esta en ingles-->
<head><!--encabezado que guarda informacion de la pagina-->
    <meta charset="UTF-8"><!--asegura que se muestren bien algunos caracteres como los acentos-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><!--se adapta al tipo de pantalla de cualquier dispositivo-->
    <title>Enlaces en HTML</title><!--titulo que aparece en la pestaña del navegador-->
</head>
<body><!--cuerpo del documento-->
    <h2>Tipos de enlaces en HTML</h2><!--es un titulo que sigue del h1-->
    <!--es un parrafo con el texto en negrita por el strong-->
    <p><strong>Enlaces/Hipervinculos a otra pagina del
         mismo sitio.
    </strong></p>
    <!--abre un enlace hacia un archivo local el cual es 1. Hola_mundo.html y el br es un salto de linea-->
    <a href="1. Hola_mundo.html">1. Hola Mundo</a><br>
    <!--abre un enlace en la misma pestaña y el br es un salto de linea-->
    <a href="2. Encabezados.html" target="_self">
        2. Encabezados</a><br>
    <!--abre un enlace en otra nueva pestaña y el br es un salto de linea-->
    <a href="3. Parrafos.html" target="_blank">
        3. Parrafos</a><br>
    <!--abre un enlace en  el documento en el marco padre y el br es un salto de linea-->
    <a href="4. Salto de linea.html" target="_parent">
        4. Salto de linea</a><br>
    <!--rompe cualquier marco y abre el contenido en toda la ventana y el br es un salto de linea--> 
    <a href="5. Enfatizado.html" target="_top">
        5. Enfatizado</a><br>
    <!--es un parrafo con el texto en negrita por el strong-->
    <p><strong>Enlaces/Hipervinculos a sitios externos
    </strong></p>
    <!--se abre en la misma pestaña y es un enlace que te lleva hacia google-->
    <a href="https://www.google.com/">Google</a><br>
    <!--se abre en la misma pestaña y es un enlace externo que te lleva hacia youtube-->
    <a href="https://www.youtube.com/" target="_self">
        YouTube</a><br>
    <!--se abre en una nueva pestaña y es un enlace externo que te lleva hacia facebook-->
    <a href="https://www.facebook.com/" target="_blank">
        FaceBook</a><br>
    <!--se abre en el marco padre y es un enlace externo que te lleva hacia wikipedia-->
    <a href="https://www.wikipedia.com/" target="_parent">
        WikiPedia</a><br>
    <!--se abre usando todo el ancho de ventana y es un enlace externo que te lleva hacia yahoo-->
    <a href="https://www.espanol.yahoo.com/" target="_top">
        Yahoo!</a><br>
</body><!--se cierra el cuerpo del documento-->
</html><!--final del documento-->
